<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The app never talks to the network. This policy blocks fetch/XHR, frames and plugins as a safety net. -->
  <meta http-equiv="Content-Security-Policy" content="connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Block Quest · Scratch Coach</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='12' width='48' height='40' rx='10' fill='%234cc3ff' stroke='%232b3a67' stroke-width='4'/%3E%3Ccircle cx='25' cy='31' r='5' fill='%232b3a67'/%3E%3Ccircle cx='39' cy='31' r='5' fill='%232b3a67'/%3E%3C/svg%3E">
</head>
<body>
  <div id="header"></div>
  <div id="banners" class="wrap"></div>
  <main id="main" class="wrap" tabindex="-1">
    <noscript>
      <section class="card">
        <h1>Please turn on JavaScript / 请开启 JavaScript</h1>
        <p>This coach needs JavaScript to show the levels. It does not use the internet.</p>
        <p>小教练需要 JavaScript 才能显示关卡。它不会联网。</p>
      </section>
    </noscript>
  </main>
  <footer id="footer" class="wrap"></footer>
  <div id="modal-root"></div>
  <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <script src="js/content-arcade.js"></script>
  <script src="js/content.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
